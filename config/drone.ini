[base]
env_name = drone

[vec]
total_agents = 2048
num_buffers = 8
num_threads = 1

[env]
num_drones = 64

# multi-task step fractions
hover_frac = 1.0
race_frac = 0.0
sphere_frac = 0.0
cube_frac = 0.0
flag_frac = 0.0

# shared
alpha_dist = 0.5936050283315333

# automatic domain randomization (adr_on=0 => static DR frozen at adr_w0)
adr_on = 0
adr_w0 = 0.75
adr_p_probe = 0.5
adr_t_lo = 0.9
adr_t_hi = 0.95
adr_step = 0.05

# hover
sphere_radius = 4.0
alpha_hover = 0.058713089382793605
hover_alpha_omega = 0.0
hover_alpha_vel = 0.005
hover_alpha_action = 0.0
hover_target_dist = 2
hover_horizon = 1024

# race
max_rings = 10
ring_reward = 1.0
race_alpha_omega = 0.0001
race_horizon = 2048

[policy]
expansion_factor = 1
hidden_size = 32
num_layers = 1

[train]
anneal_lr = 1
beta1 = 0.9205127440978271
beta2 = 0.9999599984257372
clip_coef = 0.24538079381694416
ent_coef = 5.3094837057682964e-05
eps = 4.831444291739578e-13
gae_lambda = 0.9861995160361671
gamma = 0.9891068682793783
gpus = 1
horizon = 128
learning_rate = 0.0037281345425369313
max_grad_norm = 0.1
min_lr_ratio = 0
minibatch_size = 4096
prio_alpha = 0.35078354102088527
prio_beta0 = 0.7847372909663064
replay_ratio = 3.0963958152520537
seed = 42
total_timesteps = 50_000_000
vf_clip_coef = 0.7067248245848509
vf_coef = 2.371511794283843
vtrace_c_clip = 4.84687280649928
vtrace_rho_clip = 1.7437113241448157

[sweep]
metric = perf

[sweep.train.total_timesteps]
distribution = log_normal
min = 1e7
max = 1e8
mean = 5e7
scale = auto

# race-only
#[sweep.env.ring_reward]
#distribution = log_normal
#min = 0.1
#max = 100.0
#mean = 1.0
#scale = auto

# distance-progress shaping (applied globally in c_step) -- the single distance signal for hover
[sweep.env.alpha_dist]
distribution = log_normal
min = 0.001
max = 10.0
mean = 1.0
scale = auto

