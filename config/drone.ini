[base]
env_name = drone

[vec]
total_agents = 2048
num_buffers = 8
num_threads = 1

[env]
num_drones = 64

# multi-task step fractions
hover_frac = 1.0
race_frac = 0.0
sphere_frac = 0.0
cube_frac = 0.0
flag_frac = 0.0

# shared
alpha_dist = 5.0

# automatic domain randomization (adr_on=0 => static DR frozen at adr_w0)
adr_on = 0
adr_w0 = 0.75
adr_p_probe = 0.5
adr_t_lo = 0.9
adr_t_hi = 0.95
adr_step = 0.05

# hover
sphere_radius = 4.0
alpha_hover = 0.0
hover_alpha_omega = 0.0
hover_alpha_vel = 0.0
hover_alpha_action = 0.01
hover_target_dist = 2
hover_horizon = 1024

# race
max_rings = 10
ring_reward = 1.0
race_alpha_omega = 0.0001
race_horizon = 2048

[policy]
expansion_factor = 1
hidden_size = 32
num_layers = 1

[train]
anneal_lr = 1
beta1 = 0.9605091218915885
beta2 = 0.9975342514897555
clip_coef = 0.2792041834527874
ent_coef = 0.009614464430623536
eps = 3.890998066747521e-12
gae_lambda = 0.8397140951280606
gamma = 0.9827341882497986
gpus = 1
horizon = 64
learning_rate = 0.0036073110182039277
max_grad_norm = 0.1
min_lr_ratio = 0
minibatch_size = 4096
prio_alpha = 0.5664372304116252
prio_beta0 = 1
replay_ratio = 2.321476115575771
seed = 42
total_timesteps = 100_000_000
vf_clip_coef = 5
vf_coef = 5
vtrace_c_clip = 5
vtrace_rho_clip = 3.2646604263658587

[sweep]
metric = perf

[sweep.train.total_timesteps]
distribution = log_normal
min = 1e7
max = 1e8
mean = 5e7
scale = auto

# race-only
#[sweep.env.ring_reward]
#distribution = log_normal
#min = 0.1
#max = 100.0
#mean = 1.0
#scale = auto

# distance-progress shaping (applied globally in c_step) -- the single distance signal for hover
[sweep.env.alpha_dist]
distribution = log_normal
min = 0.001
max = 10.0
mean = 1.0
scale = auto

