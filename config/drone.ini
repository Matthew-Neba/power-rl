[base]
env_name = drone

[vec]
total_agents = 2048
num_buffers = 8
num_threads = 1

[env]
num_drones = 64

# multi-task step fractions
hover_frac = 1.0
race_frac = 0.7666228609975755
sphere_frac = 0.0
cube_frac = 0.0
flag_frac = 0.0

# domain randomisation
dr = 0.05

# shared rewards
alpha_vel = 0.0
alpha_omega = 0.0
alpha_action = 0.0

# hover
sphere_radius = 4.0
hover_target_dist = 5
hover_horizon = 1024
alpha_hover = 0.12566999523727085
hover_alpha_dist = 0.09184176443094445

# race
max_rings = 10
race_horizon = 2048
ring_reward = 0.6802732971377801
race_alpha_dist = 0.3830846625769541

[policy]
expansion_factor = 1
hidden_size = 64
num_layers = 2

[train]
anneal_lr = 1
beta1 = 0.98783492760496
beta2 = 0.9999668927308267
clip_coef = 0.17832031157241168
ent_coef = 0.006134161103656022
eps = 1.3773116093915923e-13
gae_lambda = 0.948428314130271
gamma = 0.9883818405593047
gpus = 1
horizon = 128
learning_rate = 0.009832153344506116
max_grad_norm = 1.7683955000503169
min_lr_ratio = 0
minibatch_size = 32768
prio_alpha = 0
prio_beta0 = 0.5965299894037307
replay_ratio = 2.6118063750852607
seed = 42
total_timesteps = 92_642_038
vf_clip_coef = 1.3678635292330912
vf_coef = 3.821148549196701
vtrace_c_clip = 4.68519950415089
vtrace_rho_clip = 2.4822123155872364

[sweep]
metric = perf

[sweep.train.total_timesteps]
distribution = log_normal
min = 3e7
max = 2e8
mean = 8e7
scale = auto

# hover
[sweep.env.hover_alpha_dist]
distribution = log_normal
min = 0.001
max = 10.0
mean = 1.0
scale = auto

[sweep.env.alpha_hover]
distribution = log_normal
min = 0.0001
max = 1.0
mean = 0.01
scale = auto

# race
[sweep.env.race_alpha_dist]
distribution = log_normal
min = 0.001
max = 10.0
mean = 1.0
scale = auto

[sweep.env.ring_reward]
distribution = log_normal
min = 0.1
max = 100.0
mean = 1.0
scale = auto

# fracs
[sweep.env.hover_frac]
distribution = uniform
min = 0.1
max = 1.0
scale = auto

[sweep.env.race_frac]
distribution = uniform
min = 0.1
max = 1.0
scale = auto