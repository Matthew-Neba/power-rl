[base]
env_name = power_grid
# Recurrent memory crosses rollout boundaries. The backend clears only a vector
# slot whose prior step terminated, which is equivalent to starting a new agent
# for the replacement episode and never resets a live episode midway through.
reset_state = False
# Canonical from-scratch training seed and checkpoint cadence. Plain
# `puffer train power_grid` uses these values through the native backend.
seed = 5731
checkpoint_interval = 100

[env]
# Keep high-throughput training on the DC solver. Set True to run AC solver physics.
ac_power_flow = False
# Optional reset-level AC/DC domain randomization. Zero preserves the fixed
# ac_power_flow setting; training may use a small fraction of true AC episodes.
ac_power_flow_probability = 0.0
# Load and generator injections stay at one nominal dispatch in this version.
# Domain randomization remains enabled for weather, dynamic line ratings,
# outage topology/timing, and targeted AC-versus-DC curriculum rehearsal.
curriculum_ac_power_flow_probability = 0.01
offline_scenarios = True
offline_scenario_probability = 0.65
# Use the separately cached 2020 pool. Intended for held-out validation only.
offline_scenario_validation = False
# Layer persistent line outages onto this fraction of episodes.
# Their lines and later periods are randomized in either DC or AC mode.
random_events = True
random_event_probability = 1.0
# Match the live product limit: every training episode reaches a persistent
# N-1 or N-2 contingency. No line or line pair is filtered for connectivity.
random_outage_count = 2
# Set below random_outage_count to train across a range of contingency sizes.
random_outage_count_min = 1
# Training curriculum option. Normal training and deployment keep this False,
# so outages retain their randomized period during the day.
random_outages_at_reset = False
# When reset curriculum is enabled, mix overloaded recovery starts with intact
# short episodes so PPO learns both recovery and no-op behavior.
reset_outage_probability = 1.0
# With reset curriculum enabled, optionally schedule the remaining episodes at
# normal randomized periods instead of making them intact. Deployment keeps
# both curriculum switches disabled.
timed_outages_when_not_reset = False
# Curriculum option matching two rapid user clicks: delayed outages arrive on
# consecutive agent steps instead of in separate six-step operating periods.
# Reset outages and deployment are unchanged.
sequential_outages = True
# Single-run, from-scratch curriculum steps per vector slot. The canonical
# training config enables it; evaluation and deployment should override it to 0.
# Scale this inversely with total_agents when comparing agent counts at a fixed
# global timestep budget, otherwise each slot traverses a different curriculum.
curriculum_steps = 65536
# Initial fraction of curriculum resets that use recoverable N-1 starts. It
# anneals linearly to the final fraction; the remainder always use the configured
# full task. These probabilities are consulted only while curriculum_steps > 0.
curriculum_recovery_probability = 1.0
# Keep recoverable curriculum exposure throughout these short sweep runs; the
# safe and sequence categories below still provide contextual alternatives.
curriculum_recovery_probability_final = 1.0
# Fraction of selected one-step curriculum trials that start intact instead of
# with an outage. These remain unrestricted and teach contextual no-op behavior.
curriculum_safe_probability = 0.05
# Fixed fraction of episodes in a training trial that exercise consecutive
# unfiltered N-2 outages near the start, followed by a short response window.
# The hypersweep samples this once per trial; it does not ramp during training.
curriculum_sequence_probability = 0.30
# Randomize the pre-outage healthy wait from period one through this value so
# recurrent policies retain outage sensitivity after arbitrary operator timing.
curriculum_sequence_max_period = 1
# Length of intact and N-1 contextual trials. Values above one teach the policy
# to hold a recovered topology instead of immediately undoing a toggle.
curriculum_trial_steps = 4
# Final fraction of N-1 recovery trials restricted to solved overloaded states
# with at least one secure original action. It anneals from 100%; values below
# one gradually mix in unrestricted multi-step recovery while retaining easy
# rehearsal instead of changing the task abruptly.
curriculum_one_step_fraction = 1.0
# Curriculum selector. -2 progressively expands an interleaved recoverable-line
# set, -1 samples every eligible line, and nonnegative values select one line.
curriculum_outage_line = -1
# Cover outages under every daily load/weather operating point. The episode's
# chronological period remains zero because short recovery curricula do not
# advance to another period.
randomize_reset_operating_period = False
# Reset-curriculum option only: sample a connected outage state that is
# physically overloaded. Normal timed-outage training keeps this False.
initial_outage_requires_overload = False
# Easy recovery curriculum: additionally require that at least one unrestricted
# agent action can restore the overloaded reset state to its physical limit.
initial_outage_requires_one_step_recovery = False
# Curriculum-only terminal condition. Deployment and standard evaluation keep
# this False and run all 72 steps.
end_episode_on_recovery = False
max_episode_steps = 72
# Evaluation harnesses stop each vector slot after its first completed episode.
single_episode_evaluation = False
# Reward hyperparameters are copied by binding.c into each environment. The
# environment itself clamps every reward to [-1, 1], matching PPO's range.
# Failed grids terminate at a fixed reward of -1.
# Each solved step receives -weight * sum_i(max(0, rho_i - 1)^2).
reward_congestion_cost_weight = 5.0
# Small cost for every valid non-no-op switch action, including a topology-bit
# change that has no immediate electrical effect.
reward_switch_penalty = 0.001
[vec]
total_agents = 1024
num_buffers = 4
num_threads = 16

[policy]
# Canonical native MinGRU policy. Network selection is intentionally left to
# the compiled native backend rather than routed through PyTorch configuration.
hidden_size = 256
num_layers = 1

[train]
total_timesteps = 80_000_000
horizon = 72
minibatch_size = 18432
gamma = 0.9998925466613213
gae_lambda = 0.9862453022659561
learning_rate = 0.001
ent_coef = 0.15
anneal_ent_coef = 1
min_ent_coef_ratio = 0.5
vtrace_rho_clip = 0.1
vtrace_c_clip = 0.1
replay_ratio = 1.0
clip_coef = 0.916769218350675
vf_clip_coef = 0.01
vf_coef = 0.1
max_grad_norm = 5.0
beta1 = 0.999
beta2 = 0.9900769490455605
eps = 0.00006132704943138857
prio_alpha = 0.19358831332119242
prio_beta0 = 1.0

[sweep]
# Protein uses a Gaussian-process model to choose later trials from earlier
# results. `perf` is the fraction of overload-free episode steps, with failed
# episodes scored as zero.
metric = perf
use_gpu = True
# Tune the established PPO parameters alongside the four continuous reward
# tradeoffs. Reward log ranges are centered on the configured values; the PPO
# search spaces remain inherited unchanged from config/default.ini.
sweep_only = total_timesteps, hidden_size, num_layers, learning_rate, ent_coef, gamma, gae_lambda, curriculum_safe_probability, curriculum_sequence_probability, reward_congestion_cost_weight, reward_switch_penalty
max_runs = 1200
gpus = 1

[sweep.train.total_timesteps]
distribution = log_normal
min = 3e7
max = 1.6e8
scale = time

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 128
max = 512
scale = 1.0

[sweep.policy.num_layers]
distribution = int_uniform
min = 1
max = 3
scale = 1.0

[sweep.env.reward_switch_penalty]
distribution = log_normal
min = 0.00001
max = 0.1
scale = auto

[sweep.env.curriculum_safe_probability]
distribution = uniform
min = 0.0
max = 0.1
scale = auto

[sweep.env.curriculum_sequence_probability]
distribution = uniform
min = 0.0
max = 0.3
scale = auto

[sweep.env.reward_congestion_cost_weight]
distribution = log_normal
min = 0.1
max = 100.0
scale = auto
