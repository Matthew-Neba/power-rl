[base]
env_name = power_grid

[env]
# Keep high-throughput training on the DC solver. Set True to run AC solver physics.
ac_power_flow = False
# Enable complete precomputed 2019 AESO + ERA5 days. Historical episodes perform
# no network, filesystem, parsing, or allocation work during training.
offline_scenarios = True
# Keep part of the deliberately congested synthetic curriculum. Set 1.0 for
# exclusively historical days or 0.0 to retain only the original profiles.
offline_scenario_probability = 0.90
# Use the separately cached 2020 pool. Intended for held-out validation only.
offline_scenario_validation = False
# Layer persistent line outages onto this fraction of episodes.
# Their lines and later periods are randomized in either DC or AC mode.
random_events = True
random_event_probability = 0.50
# IEEE-118 event episodes contain three distinct non-islanding line outages,
# applied at distinct later operating periods.
random_outage_count = 3
# Evaluation harnesses stop each vector slot after its first completed episode.
single_episode_evaluation = False

[vec]
total_agents = 1024
num_buffers = 2
num_threads = 8

[policy]
hidden_size = 512
num_layers = 3

[train]
total_timesteps = 10_000_000
horizon = 128
minibatch_size = 12288
gamma = 0.99
gae_lambda = 0.95
learning_rate = 0.001
ent_coef = 0.001006256116938531
vtrace_rho_clip = 0.9698340596889382
vtrace_c_clip = 1.8545057711375483
replay_ratio = 1.74576269
clip_coef = 0.14454714804918123
vf_clip_coef = 1.210953307377595
vf_coef = 0.7920138648105703
max_grad_norm = 0.6049274964163137
beta1 = 0.500283098148421
beta2 = 0.999872162760339
eps = 2.2068802880653122e-14
prio_alpha = 0.9974167332033219
prio_beta0 = 0.562304973712254

[sweep]
# Protein uses a Gaussian-process model to choose later trials from earlier
# results. Maximize the fraction of overload-free steps.
metric = perf
; for some reason, puffer tweaks when I set this to true and allow the GP to run on CPU not GPU
use_gpu = False
sweep_only = total_timesteps, hidden_size, num_layers, horizon, learning_rate, ent_coef, gamma, gae_lambda, vtrace_rho_clip, vtrace_c_clip, replay_ratio, clip_coef, vf_clip_coef, vf_coef, max_grad_norm, beta1, beta2, eps, prio_alpha, prio_beta0

[sweep.train.total_timesteps]
distribution = log_normal
min = 2e7
max = 5e7
scale = time
