[base]
env_name = power_grid
rnn_name = LSTM

[vec]
total_agents = 1024
num_buffers = 2
num_threads = 8

[policy]
hidden_size = 256
num_layers = 2

[rnn]
hidden_size = 256
num_layers = 1

[train]
total_timesteps = 50_000_000
horizon = 48
minibatch_size = 12288
gamma = 0.99
gae_lambda = 0.98
learning_rate = 0.01
ent_coef = 0.10
vf_coef = 1.0
use_rnn = 1

[sweep]
# Protein uses a Gaussian-process model to choose later trials from earlier
# results. This focused 500-run search targets exploration and credit assignment.
method = Protein
metric = score
max_suggestion_cost = 900
max_runs = 500
gpus = 1
downsample = 10
sweep_only = total_timesteps, learning_rate, ent_coef, horizon, gamma, gae_lambda, hidden_size, num_layers, replay_ratio, vf_coef, max_grad_norm

[sweep.train.total_timesteps]
distribution = log_normal
min = 50_000_000
max = 200_000_000
mean = 100_000_000
scale = time

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 128
max = 512
mean = 256
scale = auto

[sweep.policy.num_layers]
distribution = int_uniform
min = 1
max = 3
mean = 2
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 16
max = 128
mean = 64
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.001
max = 0.03
mean = 0.01
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.005
max = 0.20
mean = 0.10
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.95
max = 0.9999
mean = 0.99
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.90
max = 0.999
mean = 0.98
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 0.5
max = 2.0
mean = 1.0
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 0.25
max = 2.0
mean = 1.0
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.25
max = 2.0
mean = 1.5
scale = auto
