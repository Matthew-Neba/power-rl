[base]
env_name = nethack
cudagraphs = 2

[vec]
total_agents = 512
num_buffers = 4
num_threads = 32

[env]
gold_coef = 0.20664315968023872
exp_coef = 0.22295147015438324
descent_coef = 3.0
xp_coef = 0.3909159300211229
scout_coef = 0.0007786357761852663
