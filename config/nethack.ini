[base]
env_name = nethack
cudagraphs = 2

[vec]
total_agents = 1024
num_buffers = 2
num_threads = 32

[env]
gold_coef = 0.13931580484972245
exp_coef = 0.2266256876556774
descent_coef = 7.474267914452992
