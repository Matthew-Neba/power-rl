min = 0.00001
max = 1.0
scale = auto

[sweep.env.hp_coef]
distribution = log_normal
min = 0.0001
max = 0.01
scale = auto

[sweep.env.hunger_coef]
distribution = log_normal
min = 0.002
max = 0.25
scale = auto

[sweep.env.illegal_penalty]
