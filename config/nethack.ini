[base]
env_name = nethack
cudagraphs = 2

[vec]
total_agents = 512
num_buffers = 4
num_threads = 32

[env]
gold_coef = 0.13931580484972245
exp_coef = 0.2266256876556774
descent_coef = 1.0
xp_coef = 0.38979749578705536
scout_coef = 0.006348068030646491
hp_coef = 0.0004093449437196266
illegal_penalty = 0.0
death_penalty = -0.7733233208460281

[policy]
hidden_size = 512
num_layers = 1
expansion_factor = 1

[train]
total_timesteps = 100_000_000
minibatch_size = 32768

[sweep]
metric = score

[sweep.train.total_timesteps]
distribution = log_normal
min = 1e8
max = 4e8
scale = time

[sweep.env.gold_coef]
distribution = log_normal
min = 0.001
max = 1.0
scale = auto

[sweep.env.exp_coef]
distribution = log_normal
min = 0.01
max = 1.0
scale = auto

[sweep.env.descent_coef]
distribution = log_normal
min = 0.005
max = 10.0
scale = auto

[sweep.env.xp_coef]
distribution = log_normal
min = 0.02
max = 1.0
scale = auto

[sweep.env.scout_coef]
distribution = log_normal
min = 0.00001
max = 1.0
scale = auto

[sweep.env.hp_coef]
distribution = log_normal
min = 0.0001
max = 0.01
scale = auto

[sweep.env.illegal_penalty]
distribution = uniform
min = -1.0
max = 0.0
scale = auto

[sweep.env.death_penalty]
distribution = uniform
min = -1.0
max = 0.0
scale = auto
