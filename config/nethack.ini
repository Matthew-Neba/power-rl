hunger_coef = 0.05
illegal_penalty = -0.003
death_penalty = -0.7694215595727147

[policy]
hidden_size = 512
num_layers = 3
expansion_factor = 1

[train]
total_timesteps = 200_000_000
minibatch_size = 32768
horizon = 64
learning_rate = 0.017835159802604913
gamma = 0.9937240235164522
gae_lambda = 0.8963930308774762
replay_ratio = 1.3640974116325246
clip_coef = 0.060844162151965926
vf_coef = 1.538723451755803
vf_clip_coef = 0.23936113272130416
max_grad_norm = 1.9822799485131075
ent_coef = 0.0015502230978862233
beta1 = 0.8522882268002792
beta2 = 0.995061438116354
eps = 2.8014415836915174e-10
vtrace_rho_clip = 0.5171011536035585
vtrace_c_clip = 1.098949234637856
prio_alpha = 0.7711794224306137
prio_beta0 = 0.34210195545467753

[sweep]
metric = score

[sweep.train.total_timesteps]
distribution = log_normal
min = 1e8
max = 4e8
scale = time

[sweep.env.gold_coef]
